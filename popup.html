<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CU LMS Fixer & Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="header-branding">
        <img src="icons/icon-32.png" alt="CU LMS Logo" class="app-icon">
        <div>
          <h1 class="title">CU LMS Fixer</h1>
          <p class="subtitle">Feature Configuration</p>
        </div>
      </div>
      <span class="version-badge">v1.4.0</span>
    </header>

    <main class="settings-list">
      <div class="section-title">Course Features</div>

      <label class="setting-item" for="enableDownloadButton">
        <div class="setting-info">
          <span class="setting-name">Enable download button</span>
          <span class="setting-desc">Adds direct download buttons to Moodle file resources</span>
        </div>
        <input type="checkbox" id="enableDownloadButton" class="setting-checkbox">
      </label>

      <label class="setting-item" for="enableCopyButton">
        <div class="setting-info">
          <span class="setting-name">Enable copy button</span>
          <span class="setting-desc">Adds one-click text copy buttons to reading pages</span>
        </div>
        <input type="checkbox" id="enableCopyButton" class="setting-checkbox">
      </label>

      <div class="section-title">AI / SOP Popup Controls</div>

      <label class="setting-item" for="hideSopPermanently">
        <div class="setting-info">
          <span class="setting-name">Hide and disable SOP popup (permanently)</span>
          <span class="setting-desc">Completely blocks popup & hides the floating SOP button</span>
        </div>
        <input type="checkbox" id="hideSopPermanently" class="setting-checkbox">
      </label>

      <label class="setting-item" for="disableAutoSopPopup">
        <div class="setting-info">
          <span class="setting-name">Only disable auto SOP popup</span>
          <span class="setting-desc">Suppresses auto-popup on load, allows opening via button</span>
        </div>
        <input type="checkbox" id="disableAutoSopPopup" class="setting-checkbox">
      </label>
    </main>

    <footer class="footer">
      <div class="footer-top">
        <span id="saveStatus" class="save-status">Settings saved</span>
        <a id="githubLink" href="https://github.com/ankitpandeynine/Cu-lms-fixer" target="_blank" rel="noopener noreferrer" class="github-link" title="View Source on GitHub">
          <svg class="github-icon" viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub Repo
        </a>
      </div>
      <div class="footer-credit">Made with ❤️</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
